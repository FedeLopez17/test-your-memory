<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>Soundboard — Test Your Memory</title>
  <style>
    :root {
      --ink: #202321;
      --muted: #656b66;
      --paper: #f6f4ef;
      --card: #ffffff;
      --line: #deded6;
      --accent: #d9f078;
      --accent-strong: #b9d94e;
      --shadow: 0 5px 0 rgba(32,35,33,.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 22px 16px 36px;
    }
    header { text-align: center; margin-bottom: 22px; }
    .brand-image {
      display: block;
      width: min(100%, 340px);
      max-height: 160px;
      object-fit: contain;
      margin: 0 auto 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      letter-spacing: -.045em;
      line-height: 1.05;
    }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 1rem; }
    .random-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--accent);
      border: 2px solid var(--ink);
      border-radius: 22px;
      padding: 16px;
      margin: 24px 0 28px;
      box-shadow: var(--shadow);
    }
    .dice-wrap {
      flex: 0 0 auto;
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      background: white;
      border: 2px solid var(--ink);
      border-radius: 17px;
    }
    .dice {
      font-size: 2.8rem;
      line-height: 1;
      display: block;
      transform-origin: center;
    }
    .dice.spin { animation: roll .8s cubic-bezier(.2,.8,.2,1); }
    @keyframes roll {
      0% { transform: rotate(0) scale(1); }
      35% { transform: rotate(220deg) scale(.78); }
      70% { transform: rotate(600deg) scale(1.12); }
      100% { transform: rotate(1080deg) scale(1); }
    }
    .random-copy { text-align: left; flex: 1; min-width: 0; }
    .random-copy strong { display: block; font-size: 1.05rem; }
    .random-copy span { display: block; font-size: .88rem; margin-top: 3px; color: #41473b; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .random-button {
      flex: 0 0 auto;
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 13px 17px;
      min-height: 52px;
      background: var(--ink);
      color: white;
      font-weight: 800;
      box-shadow: 0 3px 0 rgba(32,35,33,.25);
      transition: transform .12s, box-shadow .12s;
    }
    .random-button:active { transform: translateY(3px); box-shadow: none; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 12px;
    }
    h2 { font-size: 1.15rem; margin: 0; }
    .hint { color: var(--muted); font-size: .85rem; }
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .sound-button {
      min-height: 112px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 17px;
      border: 2px solid var(--ink);
      border-radius: 19px;
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow);
      transition: transform .12s, background .15s, box-shadow .12s;
      touch-action: manipulation;
    }
    .sound-button:active, .sound-button.playing {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(32,35,33,.10);
      background: #f0f5dc;
    }
    .sound-icon {
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--line);
      border-radius: 15px;
      background: #f7f7f2;
      font-size: 1.8rem;
    }
    .sound-label { font-size: 1.08rem; font-weight: 850; text-transform: capitalize; }
    .sound-sub { color: var(--muted); font-size: .78rem; margin-top: 4px; }
    .status {
      min-height: 28px;
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      margin: 19px 0 0;
    }
    .status strong { color: var(--ink); }
    .footer-note { text-align: center; margin: 24px 0 0; color: #777b74; font-size: .78rem; }
    @media (min-width: 640px) {
      .page { padding-top: 32px; }
      .sound-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
      .sound-button { min-height: 145px; flex-direction: column; justify-content: center; text-align: center; gap: 10px; padding: 16px 10px; }
      .sound-icon { width: 60px; height: 60px; flex-basis: 60px; font-size: 2rem; }
      .random-panel { padding: 18px 22px; }
    }
    @media (max-width: 420px) {
      .page { padding: 17px 12px 28px; }
      .random-panel { gap: 10px; padding: 12px; border-radius: 18px; flex-wrap: wrap; }
      .dice-wrap { width: 54px; height: 54px; border-radius: 14px; }
      .dice { font-size: 2.25rem; }
      .random-copy { flex: 1 1 calc(100% - 70px); }
      .random-button { width: 100%; }
      .sound-grid { gap: 9px; }
      .sound-button { min-height: 100px; padding: 12px 10px; gap: 10px; border-radius: 16px; }
      .sound-icon { width: 42px; height: 42px; flex-basis: 42px; font-size: 1.5rem; border-radius: 12px; }
      .sound-label { font-size: .98rem; }
      .sound-sub { font-size: .72rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img class="brand-image" src="test-your-memory.png" alt="Test Your Memory" onerror="this.style.display='none'">
      <h1>Soundboard</h1>
      <p class="subtitle">Tap a button to play a sound.</p>
    </header>

    <section class="random-panel" aria-label="Random sound selector">
      <div class="dice-wrap" aria-hidden="true"><span class="dice" id="dice">🎲</span></div>
      <div class="random-copy">
        <strong>Feeling lucky?</strong>
        <span id="random-description">Roll the dice to choose a sound at random.</span>
      </div>
      <button class="random-button" id="random-button" type="button">🎲 Random sound</button>
    </section>

    <section aria-labelledby="sounds-heading">
      <div class="section-heading">
        <h2 id="sounds-heading">Choose a sound</h2>
        <span class="hint">8 sounds</span>
      </div>
      <div class="sound-grid" id="sound-grid">
        <button class="sound-button" type="button" data-sound="hammer" aria-label="Play hammer sound">
          <span class="sound-icon" aria-hidden="true">🔨</span><span><span class="sound-label">Hammer</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="run" aria-label="Play run sound">
          <span class="sound-icon" aria-hidden="true">🏃</span><span><span class="sound-label">Run</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="slice" aria-label="Play slice sound">
          <span class="sound-icon" aria-hidden="true">🔪</span><span><span class="sound-label">Slice</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="swim" aria-label="Play swim sound">
          <span class="sound-icon" aria-hidden="true">🏊</span><span><span class="sound-label">Swim</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="eat" aria-label="Play eat sound">
          <span class="sound-icon" aria-hidden="true">🍎</span><span><span class="sound-label">Eat</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="photograph" aria-label="Play photograph sound">
          <span class="sound-icon" aria-hidden="true">📸</span><span><span class="sound-label">Photograph</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="sneeze" aria-label="Play sneeze sound">
          <span class="sound-icon" aria-hidden="true">🤧</span><span><span class="sound-label">Sneeze</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
        <button class="sound-button" type="button" data-sound="yawn" aria-label="Play yawn sound">
          <span class="sound-icon" aria-hidden="true">🥱</span><span><span class="sound-label">Yawn</span><span class="sound-sub"></br>Tap to play</span></span>
        </button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">Ready when you are.</p>
    </section>
  </main>

  <script>
    const soundNames = ["hammer", "run", "slice", "swim", "eat", "photograph", "sneeze", "yawn"];
    const audioPlayers = new Map();
    const soundButtons = [...document.querySelectorAll("[data-sound]")];
    const status = document.getElementById("status");
    const dice = document.getElementById("dice");
    const randomDescription = document.getElementById("random-description");
    const randomButton = document.getElementById("random-button");
    let lastSound = null;
    let spinTimer;

    function getPlayer(name) {
      if (!audioPlayers.has(name)) {
        const audio = new Audio(`${name}.mp3`);
        audio.preload = "auto";
        audioPlayers.set(name, audio);
      }
      return audioPlayers.get(name);
    }

    async function playSound(name) {
      const player = getPlayer(name);
      // Restart the sound if it is tapped again before it finishes.
      player.pause();
      player.currentTime = 0;
      soundButtons.forEach(button => {
        const active = button.dataset.sound === name;
        button.classList.toggle("playing", active);
        if (active) button.setAttribute("aria-pressed", "true");
        else button.setAttribute("aria-pressed", "false");
      });
      status.innerHTML = `Playing: <strong>${name}</strong>`;
      randomDescription.textContent = `Selected: ${name}`;
      try {
        await player.play();
      } catch (error) {
        status.textContent = `Couldn't play ${name}. Check that ${name}.mp3 is in the same folder as this page.`;
      }
      player.onended = () => {
        const activeButton = soundButtons.find(button => button.dataset.sound === name);
        if (activeButton) activeButton.classList.remove("playing");
        status.textContent = "Ready when you are.";
      };
    }

    soundButtons.forEach(button => {
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => playSound(button.dataset.sound));
    });

    randomButton.addEventListener("click", () => {
      let choices = soundNames.filter(name => name !== lastSound);
      if (!choices.length) choices = soundNames;
      const selected = choices[Math.floor(Math.random() * choices.length)];
      lastSound = selected;

      dice.classList.remove("spin");
      // Restart the CSS animation on every click.
      void dice.offsetWidth;
      dice.classList.add("spin");
      randomButton.disabled = true;
      randomButton.textContent = "🎲 Choosing…";
      clearTimeout(spinTimer);
      spinTimer = setTimeout(() => {
        playSound(selected);
        randomButton.disabled = false;
        randomButton.textContent = "🎲 Random sound";
      }, 820);
    });
  </script>
</body>
</html>
